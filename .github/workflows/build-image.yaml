name: '[Release] Build and Publish Docker Images'

on:
    push:
        branches:
            - master

jobs:
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: '${{ secrets.DOCKERHUB_USERNAME }}'
                  password: '${{ secrets.DOCKERHUB_TOKEN }}'

            # Needed for buildx gha cache to work
            - name: Expose GitHub Runtime
              uses: crazy-max/ghaction-github-runtime@v2

            - name: Build and push main image
              run: |
                  ./scripts/build_docker.sh push ${{ github.sha }}

            - name: Build and push self-hosted image
              run: |
                  ./scripts/build_docker_self_hosted.sh ${{ github.sha }} true
