name: 'Lint PR'

on:
    workflow_dispatch:

permissions:
    pull-requests: read

jobs:
    lint-pr:
        name: Validate PR title
        if: ${{ github.event_name != 'merge_group' }}
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
